name: Weekly sellout intelligence refresh

on:
  schedule:
    # Monday 15:30 UTC (08:30 PDT / 07:30 PST), after completed week refresh.
    - cron: '30 15 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-sellout-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install PDF renderer
        run: python -m pip install reportlab==4.4.4
      - name: Fetch latest eight allocation periods
        run: python scripts/refresh_sell_through.py
      - name: Verify sellout rules
        run: python -m unittest discover -s scripts -p test_sell_through.py
      - name: Refresh detailed workbook
        run: python scripts/refresh_workbook.py
      - name: Refresh PDF report and CSV downloads
        run: python scripts/build_report.py
      - name: Reconcile source, dashboard and report exports
        run: python scripts/validate_release.py
      - name: Commit refreshed dashboard data and downloads
        run: |
          git config user.name 'sellout-intelligence-bot'
          git config user.email 'sellout-intelligence-bot@users.noreply.github.com'
          git add data downloads
          if git diff --cached --quiet; then
            echo 'No data changes.'
            exit 0
          fi
          git commit -m "Refresh eight-week sellout report $(date -u +'%Y-%m-%d')"
          git push
